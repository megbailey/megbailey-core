name: Build, Test, and Publish

on:
    pull_request:
    push:
        branches:
            - main
        tags:
            - "v*"

permissions:
    contents: read
    packages: write
    id-token: write

jobs:
    build-and-test:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "24"
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Build
              run: npm run build

            - name: Test
              run: npm test

    publish:
        needs: build-and-test
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "24"
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Build
              run: npm run build

            - name: Upgrade npm for trusted publishing
              run: npm install -g npm@latest

            - name: Prepare npm OIDC publishing
              run: |
                  npm config set registry https://registry.npmjs.org
                  # setup-node can write an empty _authToken that blocks OIDC
                  for npmrc in "$HOME/.npmrc" .npmrc packages/utils/.npmrc packages/ui/.npmrc; do
                    if [ -f "$npmrc" ]; then
                      sed -i '/registry.npmjs.org\/:_authToken/d' "$npmrc"
                    fi
                  done
                  echo "npm $(npm --version), node $(node --version)"

            - name: Publish @megbailey/utils to npm
              working-directory: packages/utils
              run: npm publish --access public

            - name: Publish @megbailey/ui to npm
              working-directory: packages/ui
              run: npm publish --access public

            - name: Setup Node.js for GitHub Packages
              uses: actions/setup-node@v4
              with:
                  node-version: "24"
                  registry-url: https://npm.pkg.github.com
                  scope: "@megbailey"

            - name: Publish @megbailey/utils to GitHub Packages
              working-directory: packages/utils
              run: npm publish
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Publish @megbailey/ui to GitHub Packages
              working-directory: packages/ui
              run: npm publish
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
